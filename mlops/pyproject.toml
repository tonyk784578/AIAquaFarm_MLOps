[project]
name = "aquafarm-mlops"
version = "0.1.0"
description = "AIAquafarm MLOps pipeline — data collection, training, registry, and deployment"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.13.0",
    "boto3>=1.34.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "opencv-python-headless>=4.10.0",
    "ultralytics>=8.2.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "schedule>=1.2.0",
    # Observability (consumed by mlops/api/server.py; scheduler runs without HTTP)
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
