# AIAquafarm Redis configuration

# Persistence — append-only file for durability
appendonly yes
appendfsync everysec

# Memory policy: evict LRU keys when maxmemory is reached
maxmemory 256mb
maxmemory-policy allkeys-lru

# Pub/Sub channel for edge device commands
# Channels used:
#   cmd:{tank_id}:feeder   — feeding commands
#   cmd:{tank_id}:pump     — pump control commands
#   events:alerts          — real-time alert broadcast

# Connection
bind 0.0.0.0
protected-mode no
port 6379

# Keyspace notifications (for command acknowledgements)
# K=keyspace events, g=generic, x=expired, l=list commands
notify-keyspace-events "Kgxl"

# Slowlog
slowlog-log-slower-than 10000
slowlog-max-len 128
