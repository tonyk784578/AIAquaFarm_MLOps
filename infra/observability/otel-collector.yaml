# OpenTelemetry Collector config — receives traces from backend/agents/mlops_api
# and exports them. By default sends to a tempo/jaeger backend (commented).
# For local dev, the `logging` exporter is enabled so spans land in container logs.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  # Always-on: dump spans to stdout for local debugging.
  debug:
    verbosity: normal

  # Production backend example — uncomment after wiring tempo or jaeger:
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
