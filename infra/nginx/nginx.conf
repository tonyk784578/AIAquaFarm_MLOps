worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    # Hard cap on request bodies — JSON control commands are kB-sized; large
    # uploads (model checkpoints) go directly to S3 / MLflow, not through nginx.
    client_max_body_size 2M;

    # Hide nginx version + OS in error pages and headers.
    server_tokens off;

    # Security headers — applied to every response. The CSP allows the React
    # bundle's own assets plus `connect-src` to the backend WebSocket. Adjust
    # if you add third-party scripts (e.g. analytics).
    add_header Strict-Transport-Security        "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options                  "DENY"                                  always;
    add_header X-Content-Type-Options           "nosniff"                              always;
    add_header Referrer-Policy                  "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy               "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy          "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    server {
        listen 80;
        server_name _;

        # Use Docker's embedded resolver; re-resolve upstreams every 10 s so
        # nginx doesn't cache stale IPs when containers are restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Health check (for nginx itself)
        location /health {
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # Backend API — proxy to FastAPI (WebSocket at /api/v1/ws/* uses upgrade headers)
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Frontend — serve React app (frontend nginx handles /agents/ sub-proxy internally)
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SPA fallback: let React Router handle client-side routes
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
        }
    }
}
