worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    server {
        listen 80;
        server_name _;

        # Use Docker's embedded resolver; re-resolve upstreams every 10 s so
        # nginx doesn't cache stale IPs when containers are restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Health check (for nginx itself)
        location /health {
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # Backend API — proxy to FastAPI (WebSocket at /api/v1/ws/* uses upgrade headers)
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Frontend — serve React app (frontend nginx handles /agents/ sub-proxy internally)
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SPA fallback: let React Router handle client-side routes
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
        }
    }
}
