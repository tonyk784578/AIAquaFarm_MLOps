apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: aquafarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: mlflow
          image: aquafarm/mlflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aquafarm-secrets
                  key: POSTGRES_PASSWORD
            - name: MLFLOW_BACKEND_STORE_URI
              value: postgresql://aquafarm:$(POSTGRES_PASSWORD)@postgres:5432/aquafarm_mlflow
            - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
              value: /mlflow/artifacts
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow/artifacts
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
