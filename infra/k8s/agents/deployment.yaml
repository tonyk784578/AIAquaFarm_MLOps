apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: aquafarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z backend 8000; do
                echo "waiting for backend..."; sleep 5
              done
      containers:
        - name: agents
          image: aquafarm/agents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: aquafarm-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aquafarm-secrets
                  key: ANTHROPIC_API_KEY
            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aquafarm-secrets
                  key: BACKEND_API_KEY
            - name: BACKEND_URL
              value: http://backend:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
