# AutoML pipeline — runs every 6 hours to check for retraining needs.
# Triggers model retraining when new-sample thresholds OR drift PSI ≥ 0.20.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: automl-pipeline
  namespace: aquafarm
spec:
  schedule: "0 */6 * * *"   # every 6 hours
  concurrencyPolicy: Forbid  # skip if previous run still in progress
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600  # 1-hour hard timeout per run
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-mlflow
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  until nc -z mlflow 5000; do
                    echo "waiting for mlflow..."; sleep 5
                  done
          containers:
            - name: automl
              image: aquafarm/mlops:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - mlops.training.automl
                - --mlflow-uri
                - http://mlflow:5000
                - --device
                - cpu
                - --output-dir
                - /data/checkpoints
              envFrom:
                - configMapRef:
                    name: aquafarm-config
              env:
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aquafarm-secrets
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aquafarm-secrets
                      key: S3_SECRET_KEY
                - name: S3_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: aquafarm-secrets
                      key: S3_ENDPOINT_URL
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: aquafarm-secrets
                      key: S3_BUCKET_NAME
              volumeMounts:
                - name: mlops-data
                  mountPath: /data
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "4Gi"
                  cpu: "2000m"
          volumes:
            - name: mlops-data
              persistentVolumeClaim:
                claimName: mlops-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-data
  namespace: aquafarm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
