apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: aquafarm
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    bind 0.0.0.0
    protected-mode no
    port 6379
    notify-keyspace-events "Kgxl"
    slowlog-log-slower-than 10000
    slowlog-max-len 128
