# Contains the TimescaleDB initialisation SQL mounted into the postgres container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: aquafarm
data:
  init.sql: |
    -- AIAquafarm PostgreSQL + TimescaleDB initialisation script
    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
    CREATE DATABASE aquafarm_mlflow;

    DO $$
    BEGIN
        IF EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_name = 'water_quality_readings'
        ) AND NOT EXISTS (
            SELECT 1 FROM timescaledb_information.hypertables
            WHERE hypertable_name = 'water_quality_readings'
        ) THEN
            PERFORM create_hypertable(
                'water_quality_readings', 'measured_at',
                chunk_time_interval => INTERVAL '1 day', if_not_exists => TRUE
            );
        END IF;

        IF EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_name = 'fish_growth_records'
        ) AND NOT EXISTS (
            SELECT 1 FROM timescaledb_information.hypertables
            WHERE hypertable_name = 'fish_growth_records'
        ) THEN
            PERFORM create_hypertable(
                'fish_growth_records', 'measured_at',
                chunk_time_interval => INTERVAL '7 days', if_not_exists => TRUE
            );
        END IF;

        IF EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_name = 'feeding_records'
        ) AND NOT EXISTS (
            SELECT 1 FROM timescaledb_information.hypertables
            WHERE hypertable_name = 'feeding_records'
        ) THEN
            PERFORM create_hypertable(
                'feeding_records', 'started_at',
                chunk_time_interval => INTERVAL '7 days', if_not_exists => TRUE
            );
        END IF;
    END
    $$;
