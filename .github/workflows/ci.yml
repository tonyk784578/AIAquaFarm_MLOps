name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Lint backend
        run: ruff check backend/app/ backend/tests/

      - name: Lint agents
        run: ruff check agents/

      - name: Lint ai_modules
        run: ruff check ai_modules/

      - name: Lint mlops
        run: ruff check mlops/ --ignore E501,B904

  # ── Backend tests ────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: aquafarm_test
          POSTGRES_USER: aquafarm
          POSTGRES_PASSWORD: aquafarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquafarm -d aquafarm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://aquafarm:aquafarm_test@localhost:5432/aquafarm_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-32-chars-minimum
      ANTHROPIC_API_KEY: ""
      LOG_LEVEL: warning

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ai_modules
        run: pip install ai_modules/

      - name: Install backend (dev)
        run: pip install -e "backend/[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short -x

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 7

  # ── Docker build validation ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # only on PRs to save CI minutes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build agents image
        uses: docker/build-push-action@v6
        with:
          context: agents/
          file: agents/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── MLOps package tests ─────────────────────────────────────────────────────
  test-mlops:
    name: MLOps Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MLOps deps
        run: |
          pip install \
            "mlflow>=2.13.0" \
            "boto3>=1.34.0" \
            "pandas>=2.2.0" \
            "numpy>=1.26.0" \
            "scikit-learn>=1.5.0" \
            "httpx>=0.27.0" \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "structlog>=24.2.0" \
            "schedule>=1.2.0" \
            "fastapi>=0.115.0" \
            "pytest>=8.2.0"

      - name: Run mlops tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest mlops/tests/ -v --tb=short

  # ── Secret scanning (gitleaks) ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history on push

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # GITLEAKS_LICENSE is only required for org-scope features;
          # the free single-repo scan needs no token.

  # ── Frontend tests (Vitest + RTL) ──────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline --no-audit

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

  # ── Agents package tests ────────────────────────────────────────────────────
  test-agents:
    name: Agents Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Agents deps (skip torch/anthropic-heavy)
        run: |
          pip install \
            "fastapi>=0.115.0" \
            "uvicorn[standard]>=0.30.0" \
            "httpx>=0.27.0" \
            "redis[asyncio]>=5.0.0" \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "structlog>=24.2.0" \
            "tenacity>=8.3.0" \
            "sse-starlette>=2.1.0" \
            "pytest>=8.2.0" \
            "pytest-asyncio>=0.23.0" \
            "fakeredis>=2.23.0"

      - name: Run agents tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ci-test-key
          BACKEND_API_KEY: ci-test-service-key
          REDIS_URL: redis://localhost:6379/0
        run: pytest agents/tests/ -v --tb=short
